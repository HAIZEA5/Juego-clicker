<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#edf3e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Savia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html,body{height:100%}body{margin:0;font:14px system-ui,-apple-system,sans-serif;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}
html{box-sizing:border-box}html,body{height:100%}:root{height:100%;box-sizing:border-box}</style>
<title>Savia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: una pantalla. Cabecera con savia y anillo de nivel; el claro del bosque con el fruto que se cosecha; panel inferior con pestañas con icono.
   Modo día (claro del bosque) por defecto; modo noche como opción del juego. */
:root{
  color-scheme: light;
  --bg:#edf3e8; --bg2:#f6f9f2; --surface:#ffffff; --surface2:#e3ecdc; --line:#d3dfcc; --line2:#bccfb3;
  --fg:#263322; --muted:#677760; --accent:#7552c4; --accent2:#9a4cbf; --sap:#1e9466;
  --ess:#2a7fbd; --comun:#7a7590; --raro:#1c80c4; --epico:#9a3ccb; --legend:#b67f00; --rune:#0e8fb3; --star:#a87400;
  --onaccent:#ffffff; --onsap:#ffffff; --oness:#ffffff;
  --sapgrad:linear-gradient(180deg,#38b986,#1e9466); --essgrad:linear-gradient(180deg,#4aa3dd,#2a7fbd);
  --sky:linear-gradient(180deg,#a9d8ee 0%,#d4ecf1 45%,#eef3df 100%); --stageshadow:inset 0 0 40px rgba(60,90,50,.10);
  --pill:rgba(24,34,22,.55); --toast:rgba(26,34,24,.9); --toastfg:#f3f6ee; --tshadow:0 1px 3px rgba(0,0,0,.35);
  --hpbg:rgba(255,255,255,.35); --soil:#d8c3a0; --soil2:#b8976a;
  --panelbg:linear-gradient(180deg,#ffffff 0%,#f3f7ef 100%); --panelglow:0 -10px 30px -18px rgba(70,110,60,.35);
  --hilite:rgba(255,255,255,.6);
  --display:'Syne', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, sans-serif;
  --mono:'DM Mono', ui-monospace, Menlo, monospace;
}
:root[data-mode="noche"]{
  color-scheme: dark;
  --bg:#0b0815; --bg2:#141024; --surface:#1a1430; --surface2:#241c42; --line:#31284f; --line2:#41356a;
  --fg:#f1ecff; --muted:#a095c9; --accent:#b98fff; --accent2:#e3a6ff; --sap:#8ff2c8;
  --ess:#9fd8ff; --comun:#d9d0f0; --raro:#6fd0ff; --epico:#d77dff; --legend:#ffd166; --rune:var(--rune); --star:#fff3c4;
  --onaccent:#140d25; --onsap:#0d2a20; --oness:#0c2033;
  --sapgrad:linear-gradient(180deg,#b8ffe3,#8ff2c8); --essgrad:linear-gradient(180deg,#e2f4ff,#9fd8ff);
  --sky:radial-gradient(90% 60% at 50% 105%, #2c1f52 0%, transparent 70%),linear-gradient(180deg,#0d0a1d 0%,#120d26 60%,#1a1236 100%); --stageshadow:inset 0 0 60px rgba(0,0,0,.45);
  --pill:transparent; --toast:rgba(12,9,22,.94); --toastfg:#f1ecff; --tshadow:0 1px 3px #000;
  --hpbg:rgba(8,6,16,.7); --soil:#2a1c3f; --soil2:#3a2858;
  --panelbg:linear-gradient(180deg,#1d163a 0%,#151026 60%,#120e22 100%); --panelglow:0 -10px 30px -18px rgba(185,143,255,.5);
  --hilite:rgba(255,255,255,.06);
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px}

header{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.brand{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.amount{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(28px,8.5vw,38px);color:var(--sap);line-height:1.05;
  text-shadow:0 0 22px color-mix(in srgb,var(--sap) 40%,transparent)}
.ring{position:relative;width:58px;height:58px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .lvn{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .lvn b{font-family:var(--display);font-weight:800;font-size:19px;display:block}
.ring .lvn span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chips{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;min-height:20px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip.sp{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.chip.auto{color:var(--sap);border-color:color-mix(in srgb,var(--sap) 35%,var(--line))}
.chip.rank{color:var(--accent2)}

#stage{position:relative;flex:1 1 auto;min-height:230px;border-radius:22px;overflow:hidden;
  background:var(--sky);
  border:1px solid var(--line);touch-action:manipulation;cursor:pointer;
  box-shadow:var(--stageshadow)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fruitbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(230px,62%);text-align:center;pointer-events:none;background:var(--pill);border-radius:14px;padding:5px 10px 7px}
.fname{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.01em;text-shadow:var(--tshadow)}
.fsub{font-size:11px;color:var(--toastfg);opacity:.8;margin-top:1px;text-shadow:var(--tshadow)}
.hp{margin-top:6px;height:7px;border-radius:7px;background:var(--hpbg);border:1px solid rgba(255,255,255,.25);overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,color-mix(in srgb,currentColor 60%,#fff 0%),currentColor);transition:width .08s;box-shadow:0 0 10px currentColor}
.hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:var(--toastfg);text-shadow:var(--tshadow);pointer-events:none;transition:opacity .6s}
.float{position:absolute;pointer-events:none;font-family:var(--mono);font-size:14px;font-weight:500;color:#fff;
  transform:translate(-50%,-50%);animation:rise .8s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.float.crit{color:#ffd166;font-size:18px}
.float.sap{color:#b8ffe3;font-size:16px}
@keyframes rise{to{transform:translate(-50%,-170%);opacity:0}}
#toasts{position:absolute;top:78px;left:10px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{font-size:12px!important;color:var(--toastfg);background:var(--toast);border:1px solid var(--line2);border-radius:12px;padding:7px 12px;font-size:13px;animation:tin .25s ease-out;max-width:100%;text-align:center}
.toast b{font-weight:700}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

#panel{flex:0 0 auto;height:40%;min-height:220px;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--surface) 0%,var(--bg2) 100%);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line);padding:4px 4px 0}
.tab{background:none;border:0;color:var(--muted);font:600 10.5px var(--body);padding:7px 0 8px;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"] svg{stroke:var(--accent)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.tab .dot{position:absolute;top:5px;left:calc(50% + 8px);width:7px;height:7px;border-radius:50%;background:var(--sap);box-shadow:0 0 8px var(--sap)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 2px 0}
.h h3{margin:0;font-family:var(--display);font-weight:800;font-size:17px}
.h span{font-size:12px;color:var(--muted);text-align:right}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;
  background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--fg);font:inherit;cursor:pointer}
.ico{grid-row:1 / span 2;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--accent)}
.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row .n{font-weight:600;font-size:15px;min-width:0}
.row .n small{font-family:var(--mono);color:var(--accent);font-weight:400;font-size:12px;margin-left:6px}
.row .d{font-size:12px;color:var(--muted);min-width:0}
.row .c{font-family:var(--mono);font-size:13px;color:var(--sap);text-align:right;grid-row:1 / span 2;grid-column:3}
.row.no{opacity:.5}.row.no .c{color:var(--muted)}
.row.max{cursor:default}.row.max .c{color:var(--muted)}
.row:active:not(.no):not(.max){transform:scale(.985)}
.note{font-size:12px;color:var(--muted);padding:0 2px;line-height:1.45}

.slot{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.slot-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slot-h b{font-size:15px}.slot-h span{font-size:12px;color:var(--muted);text-align:right}
.gems{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px;align-items:stretch}
.gem{border:1px dashed var(--line);background:none;border-radius:10px;padding:6px 2px;font:500 11px var(--mono);color:var(--muted);cursor:default;min-width:0}
.gem.own{border-style:solid;cursor:pointer;color:var(--fg);border-color:color-mix(in srgb,currentColor 50%,var(--line))}
.gem.on{background:color-mix(in srgb,currentColor 18%,transparent);box-shadow:0 0 12px -2px color-mix(in srgb,currentColor 60%,transparent)}
.gem .amic{display:block;width:18px;height:18px;margin:0 auto 3px;fill:currentColor}
.gem:not(.own) .amic{opacity:.25}
.gem.own .amic{filter:drop-shadow(0 0 5px currentColor)}
.gem i{display:block;width:11px;height:11px;margin:0 auto 4px;background:currentColor;transform:rotate(45deg);border-radius:2px}
.gem:not(.own) i{opacity:.25}
.upbtn{border:1px solid var(--line);background:var(--surface2);color:var(--sap);border-radius:10px;font:500 11px var(--mono);padding:4px 8px;cursor:pointer;line-height:1.3}
.upbtn small{display:block;color:var(--muted);font-family:var(--body);font-size:10px}
.upbtn:disabled{color:var(--muted);opacity:.6;cursor:default}

.sk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;padding-block:4px}
.col::before{content:"";position:absolute;top:22px;bottom:30px;left:50%;width:2px;background:linear-gradient(var(--line2),var(--line));transform:translateX(-50%)}
.col h4{margin:0;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--surface);position:relative;padding:0 6px}
.node{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg2);color:var(--muted);font:500 12px var(--mono);cursor:pointer;display:grid;place-items:center}
.node.major{width:52px;height:52px;border-radius:16px;transform:rotate(45deg)}
.node.major>*{transform:rotate(-45deg)}
.node .nic{display:grid;place-items:center}.node .nic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.node .ncost{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font:600 10px var(--mono);background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:0 5px;color:var(--fg);line-height:14px}
.node.major .ncost{transform:rotate(-45deg) translate(0,0);bottom:auto;top:auto;left:auto;right:-8px;margin-bottom:-38px}
.node.got .ncost{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.node.av{border-color:var(--accent);color:var(--fg);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent),0 0 16px -2px var(--accent)}
.node.got{background:radial-gradient(circle at 35% 30%,var(--accent2),var(--accent));border-color:var(--accent);color:var(--bg)}
.node.sel{outline:2px solid var(--sap);outline-offset:3px}
.detail{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.detail b{font-size:15px}.detail p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.big{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--onaccent);border:0;border-radius:12px;padding:11px;font:700 14px var(--body);cursor:pointer}
.big:disabled{background:var(--surface2);color:var(--muted);cursor:default}
.big.warn{background:var(--legend)}
.big.sapb{background:var(--sapgrad)}

.mis{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.mis.done{border-color:color-mix(in srgb,var(--sap) 55%,var(--line));box-shadow:0 0 18px -6px var(--sap)}
.mis .t{font-weight:600;font-size:14px;min-width:0}
.mis .t em{font-style:normal;font-size:11px;color:var(--legend);margin-left:4px;letter-spacing:.1em}
.mis .rw{font-size:12px;color:var(--muted);grid-column:1;min-width:0}
.bar{grid-column:1 / -1;height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--sap));width:0;transition:width .2s}
.mis .pg{font-family:var(--mono);font-size:12px;color:var(--fg);text-align:right;grid-row:1;grid-column:2}
.claim{grid-column:2;grid-row:2;border:0;border-radius:10px;padding:6px 12px;font:700 12px var(--body);background:var(--sap);color:var(--onsap)!important;color:var(--onsap);cursor:pointer}
.rankbox{background:radial-gradient(120% 100% at 0% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.rankbox .top{display:flex;justify-content:space-between;align-items:baseline}
.rankbox b{font-family:var(--display);font-size:16px;color:var(--accent2)}
.rankbox span{font-size:12px;color:var(--muted)}

.herb{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,38px);gap:6px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.hrow.full{border-color:color-mix(in srgb,var(--legend) 45%,var(--line))}
.hrow .hn{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hn small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.cell{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg)}
.cell img{width:32px;height:32px}
.cell.no{border-style:dashed;color:var(--line2);font:500 13px var(--mono)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stat b{font-family:var(--mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.float{animation-duration:.01s}.toast{animation:none}}

/* --- portal y santuario --- */
.chip.ess{color:var(--ess);border-color:color-mix(in srgb,var(--ess) 40%,var(--line))}
.portal{position:relative;display:grid;place-items:center;padding:2px 0}
.portal svg{width:150px;height:150px;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--accent) 35%,transparent))}
.portal .core{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.portal .core b{display:block;font-family:var(--display);font-weight:800;font-size:22px}
.portal .core span{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.portal .swirl{transform-origin:70px 70px;animation:spin 14s linear infinite}
.portal.ready .swirl{animation-duration:3s}
.portal.ready svg{filter:drop-shadow(0 0 22px var(--ess))}
@keyframes spin{to{transform:rotate(360deg)}}
.preq{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:linear-gradient(180deg,var(--hilite),rgba(255,255,255,0)),var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.preq.done{border-color:color-mix(in srgb,var(--c) 55%,var(--line));box-shadow:0 0 16px -8px var(--c)}
.preq .pn{font-weight:600;font-size:14px;min-width:0}
.preq .pn i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;box-shadow:0 0 8px var(--c);vertical-align:middle}
.preq .pn small{display:block;font:400 12px var(--mono);color:var(--muted);margin-top:2px}
.preq .bar{grid-column:1 / -1}.preq .bar i{background:var(--c);box-shadow:0 0 8px var(--c)}
.offer{border:1px solid color-mix(in srgb,var(--c) 50%,var(--line));background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--fg);border-radius:10px;padding:6px 12px;font:700 12px var(--body);cursor:pointer}
.preq .ok{color:var(--c);font:700 13px var(--mono)}
.big.ess{background:var(--essgrad);color:var(--oness);box-shadow:0 0 22px -6px var(--ess)}
.essbox{display:flex;align-items:baseline;justify-content:space-between;background:radial-gradient(120% 100% at 0% 0%,color-mix(in srgb,var(--ess) 18%,transparent),transparent 70%),var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:10px 12px}
.essbox b{font:500 24px var(--mono);color:var(--ess);text-shadow:0 0 14px color-mix(in srgb,var(--ess) 50%,transparent)}
.essbox span{font-size:12px;color:var(--muted)}
.row.ess.can .c{background:var(--essgrad);color:var(--oness);box-shadow:0 0 14px -4px var(--ess)}
.tabs.many .tab{font-size:9.5px;letter-spacing:-.01em}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.phases{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.phases span{font:600 12px var(--body);padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.phases .pc{color:var(--fg);border-color:var(--c);box-shadow:0 0 12px -4px var(--c)}
.phases .pd{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.story{position:absolute;left:12px;right:12px;bottom:12px;background:var(--toast);color:var(--toastfg);
  border:1px solid var(--line2);border-radius:16px;padding:14px 16px;box-shadow:0 0 40px -10px var(--accent);animation:tin .4s ease-out;cursor:pointer}
.story small{font:600 10px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent2)}
.story h4{margin:4px 0 6px;font-family:var(--display);font-weight:800;font-size:18px}
.story p{margin:0;font-size:14px;line-height:1.55;color:var(--toastfg);max-width:60ch}
.story em{color:var(--toastfg)!important;opacity:.6}
.rlist{display:block;line-height:1.7}

 'La semilla cayó una noche sin luna. Nadie la vio caer, salvo tú. Al tocar la tierra brilló un instante y se quedó quieta, esperando.',

 'Dentro de cada granada hay cientos de semillas, y en cada una un recuerdo diminuto: un río, una risa, un camino de piedra que ya no existe.',
 'La luna se acerca un poco cada noche para mirar el árbol. O quizá es el árbol el que crece hacia ella.',
 'A través de la piel de las peras se ve otro bosque, muy lejano, donde alguien cuida un árbol igual que el tuyo.',
 'El ámbar guarda lo que el tiempo quiso llevarse. En este fruto hay una hoja de hace mil años, intacta y todavía verde.',
 'Ahora lo sabes: la semilla no cayó de cualquier cielo. Cayó de una estrella que se apagaba y quiso seguir viviendo de otra forma.',
 'Cada amanecer el árbol cambia de color durante un segundo. Es su manera de dar las gracias.',
 'Bajo las raíces se abre un cielo entero. El árbol no crece hacia arriba: crece hacia todas partes a la vez.',
 'El pulso que sentiste al principio era este corazón. Late por cada bosque que fue talado y por cada uno que aún vendrá.',
 'Al final de todas las ramas no hay nada. Y en esa nada, una semilla nueva espera a que alguien la vea caer.',
 'Algunos frutos ya no cuelgan: orbitan. Dan una vuelta al árbol cada noche y vuelven a su rama antes del alba.',
 'Dentro de esta granada no hay semillas, sino soles diminutos. El bosque ya no necesita esperar a la mañana.',
 'Cuando la luna tapa al sol, el árbol se queda en silencio. Es el único momento en que se oyen crecer las raíces.',
 'La estrella de la que cayó la semilla no se apagó del todo. Su corazón late ahora aquí, entre tus ramas.',
 'Por fin amanece en el bosque. Los nombres grabados en la piedra del Santuario brillan, y entre ellos está el tuyo.',
 'Al final encuentras la primera semilla, la que empezó todo. Es idéntica a la que viste caer aquella noche sin luna.'];

const SFX=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000)return (n<100&&n%1?n.toFixed(1):Math.floor(n).toString()).replace('.',',');
  const e=Math.floor(Math.log10(n)/3);
  if(e>=SFX.length)return n.toExponential(2).replace('e+','e').replace('.',',');
  const v=n/Math.pow(1000,e);
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v).toString()).replace('.',',')+' '+SFX[e];
}

function newFruit(){bornAt=performance.now();
  const F=fx();const w=rarW(F);
  const ru=(S.runic&&runeOn())||chOn('runico');const r=roll(w);const max=40*Math.pow(1.19,S.L-1)*FR_HP[r]*hpMul()*Math.max(1,2-0.2*(S.L-1))*(ru?2.5:1);

const nPlots=()=>4+(S.portales>0?2:0);
function fixPlots(){while(S.plots.length<nPlots())S.plots.push({s:-1,at:0});}
const growMul=()=>starOn('huerto')?0.5:1;
const plotLeft=pl=>pl.s<0?0:Math.max(0,pl.at+SEEDS[pl.s].dur*growMul()*1000-Date.now());
function harvest(i){const pl=S.plots[i];if(pl.s<0||plotLeft(pl)>0)return;const F=fx(),k=pl.s;let msg='';
  if(k===0){const g=fruitSv(S.L,F)*80;gain(g);addXp(xpNeed(S.L)*0.1);msg='+'+fmt(g)+' savia';}
  else if(k===1){const g=fruitSv(S.L,F)*300;gain(g);dropAmulet(1,F,false,1);msg='+'+fmt(g)+' savia y un amuleto';}
  else{const g=fruitSv(S.L,F)*1200;gain(g);dropAmulet(2,F,false,2);if(S.portales>0){S.esencia+=3;S.essTotal+=3;msg='+'+fmt(g)+' savia, amuleto y +3 esencia';}else{S.sp+=2;msg='+'+fmt(g)+' savia, amuleto y +2 puntos';}}
  S.plots[i]={s:-1,at:0};S.st.harv=(S.st.harv||0)+1;ev('harv',1);sfx('vis');toast('Cosecha: <b style="color:'+SEEDS[k].col+'">'+SEEDS[k].n+'</b> · '+msg,'hv');}
const blocked=()=>S.L%10===0&&!S.boss[S.L];
const bossReady=()=>blocked()&&S.xp>=xpNeed(S.L)&&!S.fruit.boss;
let bossEnd=0;const bossDur=()=>30+(starOn('reloj')?15:0);
function startBoss(){const F=fx();const max=40*Math.pow(1.19,S.L-1)*hpMul()*12;S.fruit={r:3,hp:max,max,t:tierIdx(S.L),boss:1};bornAt=performance.now();
  bossEnd=performance.now()+bossDur()*1000;sfx('portal');toast('¡El <b style="color:#ff6b8a">guardián</b> despierta! Rómpelo antes de que acabe el tiempo');}
function defeatBoss(){const F=fx();const g=fruitSv(S.L,F)*60;gain(g);S.boss[S.L]=1;S.sp++;burst(3,S.fruit.t);burst(2,S.fruit.t);sfx('lvl');
  toast('<b style="color:#ff6b8a">Guardián derrotado</b> · +'+fmt(g)+' savia · +1 punto de habilidad');dropAmulet(2,F,false,1);S.st.boss=(S.st.boss||0)+1;newFruit();addXp(0);}
function chalCheck(){if(!S.chal)return;const id=S.chal,n=chN(id);if(n>=3){S.chal=null;return;}if(S.L>=CHAL_GOAL[n]){S.chalDone[id]=n+1;S.chal=null;bumpFx();sfx('ach');const C2=CHAL.find(c=>c.id===id);
  storyQ.push('c:'+id);toast('Reto superado: <b style="color:var(--accent)">'+C2.n+'</b> · '+C2.w(n+1)+' para siempre');sig='';}}
function addXp(x){S.xp+=x;let ups=0,pts=0;
  if(blocked())S.xp=Math.min(S.xp,xpNeed(S.L));
  while(S.xp>=xpNeed(S.L)&&!blocked()){S.xp-=xpNeed(S.L);S.L++;if(S.L%2===0){S.sp++;pts++;}ups++;
    const t=TIERS.find(t=>t.l===S.L);if(t)toast('Nuevo fruto: <b style="color:var(--accent2)">'+t.n+'</b>');}
  if(ups){chalCheck();bumpFx();S.maxL=Math.max(S.maxL,S.L);sfx('lvl');lvlFx={L:S.L,t:performance.now()};toast('El árbol sube a <b>nivel '+S.L+'</b>'+(pts?' · +'+pts+' punto'+(pts>1?'s':'')+' de habilidad':''));}
}
function gain(n){S.savia+=n;S.all+=n;S.st.run.savia+=n;ev('savia',n);}

function openFruit(silent,auto){
  const F=fx();const f=S.fruit;const r=RAR[f.r];
  const times=Math.random()<F.racimo?2:1;
  const mL=mlv(S.mast[f.t]);const sv=fruitSv(S.L,F)*FR_SV[f.r]*times*(f.ru?0.5:1)*(1+0.05*mL);
  gain(sv);S.frutos+=times;S.st.run.fruits+=times;S.st.byR[f.r]+=times;
  ev('open',times);if(f.r>=1)ev('rare',times);if(f.r>=2)ev('epic',times);if(f.r===3)ev('legend',times);
  if(times>1)ev('racimo',1);if(auto)ev('wind',times);
  S.mast[f.t]=(S.mast[f.t]||0)+times;{const nL=mlv(S.mast[f.t]);if(nL>mL){bumpFx();if(!silent){toast('Maestría de <b style="color:var(--accent)">'+TIERS[f.t].n+'</b> · nivel '+nL+' · +'+(5*nL)+'% savia y exp de este fruto','ms');sfx('ach');}}}
  const hk=f.t+'_'+f.r;if(!S.herb[hk]){S.herb[hk]=1;ev('herb',1);
    if(!silent)toast('Herbario: <b style="color:var('+r.col+')">'+TIERS[f.t].n+' '+r.f+'</b> · ¡nueva!','he');}
  if(!silent){burst(f.r,f.t);sfx('open',f.r);floatAt(fruitPos.x,fruitPos.y-20,'+'+fmt(sv),'sap');
    if(times>1)toast('<b style="color:var(--sap)">¡Racimo!</b> el fruto da el doble','rc');
    else if(f.r>0)toast('<b style="color:var('+r.col+')">'+TIERS[f.t].n+' '+r.f+'</b> · +'+fmt(sv)+' savia','fr');}
  if(Math.random()<0.03*[1,2,4,8][f.r]*times){const k=roll([80,17*(1+f.r),3*(1+2*f.r)]);S.seeds[k]++;if(!silent)toast('Encuentras una <b style="color:'+SEEDS[k].col+'">'+SEEDS[k].n.toLowerCase()+'</b>','sd');}
  const ch=Math.min(0.9,F.amChance*[1,1.5,2.5,4][f.r]);
  for(let k=0;k<times;k++)if(Math.random()<ch)dropAmulet(f.r,F,silent);
  if(f.ru)for(let k=0;k<times;k++)if(Math.random()<keyChance(f.r,F)){S.keys++;S.st.keys=(S.st.keys||0)+1;ev('key',1);
    if(!silent){toast('¡<b style="color:var(--rune)">Llave rúnica</b>! Tienes '+S.keys,'ky');sfx('vis');for(let i=0;i<16;i++){const an=Math.random()*7,sp2=40+Math.random()*120;parts.push({x:fruitPos.x,y:fruitPos.y,vx:Math.cos(an)*sp2,vy:Math.sin(an)*sp2-60,life:1,col:'var(--rune)',sz:2.2});}}}
  addXp(fruitXp(S.L,f.r)*F.xpm*times*(f.ru?0.6:1)*(1+0.05*mL));
  newFruit();
}
function dropAmulet(fr,F,silent,minR){bumpFx();
  const t=AM[Math.floor(Math.random()*AM.length)];
  const w=[70,22,7,1].map((v,i)=>i<(minR||0)?0:v*Math.pow(1+0.15*F.luck+0.4*fr,i)*(i===3&&sk('f6')?3:1));
  const r=roll(w);const key=t.id+'_'+r;const had=S.am[key];
  S.am[key]=(had||0)+1;
  if(S.eq[t.id]==null||S.eq[t.id]<r)S.eq[t.id]=r;
  S.st.amulets++;ev('amulet',1);if(r>=1)ev('amrare',1);
  if(!silent)toast('Amuleto: <b style="color:var('+RAR[r].col+')">'+t.n+' '+MAT[r]+'</b>'+(had?' · sube a nv '+S.am[key]:' · ¡nuevo!'),'am');
  
}
function hit(power,auto){
  const F=fx();let p=power,crit=false;
  if(!auto&&Math.random()<F.crit){p*=F.critM;crit=true;ev('crit',1);S.st.crit++;}
  if(!auto&&p>S.st.maxHit)S.st.maxHit=p;S.fruit.hp-=p;shake=Math.min(1.4,shake+0.8);
  if(!auto)floatAt(fruitPos.x+(Math.random()-0.5)*44,fruitPos.y-14,crit?'¡'+fmt(p)+'!':fmt(p),crit?'crit':'');
  if(S.fruit.hp<=0){if(S.fruit.boss)defeatBoss();else openFruit(false,auto);}
}

// ---------- sonido ----------
let AC=null;
function sfx(k,r){if(!S.sound)return;try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();}
  const notes={tap:[0],open:[0,4,7],lvl:[0,4,7,12],vis:[12,7,12],ach:[7,12,16],portal:[0,7,12,16,19]}[k]||[0];
  const base=k==='tap'?[523,587,659,784,880][Math.floor(Math.random()*5)]:k==='open'?392*Math.pow(2,(r||0)*2/12):440;
  const t0=AC.currentTime;notes.forEach((n,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=k==='tap'?'sine':'triangle';
    o.frequency.value=base*Math.pow(2,n/12);const st=t0+i*(k==='tap'?0:0.07),v=k==='tap'?0.025:0.045,d=k==='tap'?0.12:0.5;
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+0.01);g.gain.exponentialRampToValueAtTime(0.0001,st+d);
    o.connect(g).connect(AC.destination);o.start(st);o.stop(st+d+0.05);});}catch(e){}}

// ---------- música ambiental ----------
let MU=null;
const SCALES=[[0,2,4,7,9],[2,4,7,9,11],[9,12,14,16,19],[4,7,9,11,14]];// primavera, verano, otoño, invierno (pentatónicas)
const ROOTS=[261.63,293.66,220,164.81];
function musicStart(){if(MU||!S.music)return;try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();}if(AC.state==='suspended')AC.resume();
  const out=AC.createGain();out.gain.value=0.0001;out.gain.linearRampToValueAtTime(1,AC.currentTime+3);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;const dl=AC.createDelay(1.5);dl.delayTime.value=0.45;const fb=AC.createGain();fb.gain.value=0.35;
  lp.connect(out);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(out);out.connect(AC.destination);
  MU={out,lp,next:AC.currentTime+0.2,pad:AC.currentTime+0.1,timer:setInterval(musicTick,250)};}catch(e){MU=null;}}
function musicStop(){if(!MU)return;const m=MU;MU=null;clearInterval(m.timer);try{m.out.gain.cancelScheduledValues(AC.currentTime);m.out.gain.setTargetAtTime(0.0001,AC.currentTime,0.4);setTimeout(()=>m.out.disconnect(),2000);}catch(e){}}
function note(f,t,d,v,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(type==='sine'?2:0.02));
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(MU.lp);o.start(t);o.stop(t+d+0.1);}
function musicTick(){if(!MU||!AC)return;const se=seasonOn()?S.season:0,sc=SCALES[se],root=ROOTS[se],now=AC.currentTime,f=i=>root*Math.pow(2,i/12);
  while(MU.pad<now+1){const deg=[0,3,1,4][Math.floor(MU.pad/8)%4];for(const k of [0,2,4])note(f(sc[(deg+k)%5]-12+(deg+k>4?12:0)),MU.pad,8.5,0.012,'sine');MU.pad+=8;}
  while(MU.next<now+1){if(Math.random()<0.6)note(f(sc[Math.floor(Math.random()*5)]+(Math.random()<0.4?12:0)),MU.next,1.6,0.018,'triangle');MU.next+=[0.5,0.75,1,1.5][Math.floor(Math.random()*4)];}}

const GUIDES={

 mi:['Misiones','Siempre tienes tres misiones a la vista. Cuando completes una, recoge su premio. Cada 10 misiones subes de rango y ganas puntos de habilidad y un amuleto especial.'],
 hu:['Huerto','Algunos frutos sueltan semillas. Plántalas en el huerto: crecen en tiempo real, aunque cierres el juego. Cuanto más larga es la espera, mejor es la cosecha.'],
 di:['Diario','Aquí tienes el herbario con cada fruto que descubres, que da bonus para siempre, la crónica del bosque, los logros, la personalización del jardín y los ajustes.'],

 ru:['Fruto rúnico','Con el botón de la runa, arriba a la izquierda del jardín, cambias a frutos rúnicos. Son más duros y dan menos savia y experiencia, pero cada uno puede soltar una llave rúnica para el portal. El porcentaje sube con la suerte y con la rareza del fruto.'],
 sa:['Santuario','Gasta aquí la esencia. El viento cosecha por ti, el jardinero compra mejoras, el mensajero recoge misiones y las criaturas te ayudan cada una a su manera. Nada de esto se pierde al cruzar el portal.'],
 boss:['Guardianes','Cada 10 niveles un guardián bloquea el camino. Tienes 30 segundos para romperlo, así que toca lo más rápido que puedas. Si no llegas, mejora tu fuerza y vuelve a intentarlo.'],
 es:['Estaciones','Las estaciones han despertado y cada una cambia las reglas del bosque. Cruza tres portales en una estación para pasar a la siguiente y ganar un sello permanente.'],
 cs:['Constelaciones','Has completado el ciclo de las cuatro estaciones. Ahora puedes ascender: pierdes casi todo, pero ganas polvo estelar para encender estrellas con bonus enormes y permanentes.']};
function guide(id){if(!S.guides)S.guides={};if(S.guides[id])return;S.guides[id]=1;storyQ.push('g:'+id);}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function dailyCheck(){const t=today();if(S.daily.last===t)return;if(!S.daily.last&&!S.frutos){S.daily={last:t,streak:1};return;}const y=new Date();y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  S.daily.streak=S.daily.last===ys?S.daily.streak+1:1;S.daily.last=t;S.st.bestStreak=Math.max(S.st.bestStreak||0,S.daily.streak);
  const n=S.daily.streak,d=((n-1)%7)+1,F=fx();const g=fruitSv(S.L,F)*20*d;gain(g);let extra='';
  if(d===3){S.seeds[1]++;extra=' y una semilla de luna';}else if(d===5){dropAmulet(1,F,true,1);extra=' y un amuleto';}else if(d===7){S.seeds[2]++;S.sp++;extra=', una semilla estelar y un punto de habilidad';}
  storyQ.unshift('d:'+JSON.stringify({n,g:fmt(g),x:extra}));}
function pending(){const l=[];fixPlots();
  const ready=S.plots.filter(p=>p.s>=0&&plotLeft(p)===0).length;if(ready)l.push(ready+(ready===1?' planta lista':' plantas listas')+' en el huerto');
  const free=S.plots.filter(p=>p.s<0).length,seeds=S.seeds.reduce((a,b)=>a+b,0);if(S.unl.hu&&free&&seeds)l.push(Math.min(free,seeds)+(Math.min(free,seeds)===1?' parcela vacía':' parcelas vacías')+' y semillas para plantar');
  if(runeOn()&&S.keys>0&&S.portal.k<KEYS_N)l.push(S.keys+(S.keys===1?' llave rúnica':' llaves rúnicas')+' sin colocar en el portal');
  const mis=S.mis.filter(m=>misProg(m)>=m.g).length;if(S.unl.mi&&mis)l.push(mis+(mis===1?' misión':' misiones')+' por recoger');
  if(S.unl.sk&&SKALL.some(n=>skAvail(n)&&S.sp>=n.p))l.push(S.sp+' puntos de habilidad para gastar');
  if(S.unl.po&&phaseDone()&&S.portal.ph<2)l.push('una fase del portal lista para completar');
  if(S.event){const E=EVENTS.find(e=>e.k===S.event.k);l.push('el evento '+E.n.toLowerCase()+' está en marcha');}
  return l;}
function returnSummary(away){if(away<90)return;const l=pending();if(l.length)storyQ.push('r:'+JSON.stringify(l));}
function storyText(id){if(id.startsWith('r:')){const l=JSON.parse(id.slice(2));return {k:'Al volver',t:'Te esperan en el bosque',p:'<span class="rlist">'+l.map(x=>'· '+x[0].toUpperCase()+x.slice(1)).join('<br>')+'</span>'};}
  if(id.startsWith('c:')){const C2=CHAL.find(c=>c.id===id.slice(2)),n=chN(C2.id);return {k:'Reto superado',t:C2.n+' '+'★'.repeat(n)+'☆'.repeat(3-n),p:'Has llegado al nivel '+CHAL_GOAL[n-1]+' con la regla «'+C2.r.toLowerCase()+'». Ganas <b>'+C2.w(n)+'</b> para siempre'+(n<3?'. La próxima vez el reto pedirá el nivel '+CHAL_GOAL[n]+'.':'. Has completado este reto.')};}
  if(id.startsWith('b:')){const B=BIOMES[+id.slice(2)];return {k:'Nuevo escenario',t:B.n,p:B.t+' <b>'+B.b+'.</b>'};}
  if(id.startsWith('d:')){const o=JSON.parse(id.slice(2)),d=((o.n-1)%7)+1;
  const next=d<3?'el día 3 trae una semilla de luna.':d<5?'el día 5 trae un amuleto.':d<7?'el día 7 trae una semilla estelar y un punto de habilidad.':'la racha sigue y los regalos crecen.';
  return {k:'Regalo del día · racha de '+o.n+(o.n===1?' día':' días'),t:'¡Hola de nuevo!',p:'El bosque te ha guardado <b style="color:var(--sap)">+'+o.g+' de savia</b>'+o.x+'. Vuelve mañana para seguir la racha: '+next};}
  if(id.startsWith('g:')){const g=GUIDES[id.slice(2)];return {k:'Cómo funciona',t:g[0],p:g[1]};}if(id[0]==='t'){const i=+id.slice(1);return {k:'Crónica del bosque',t:TIERS[i].n,p:STORY_T[i]};}
  const i=+id.slice(1);return {k:'Crónica · portal '+(i+1),t:STORY_P[i][0],p:STORY_P[i][1]};}
const UNL={hu:['Huerto',()=>S.seeds.some(x=>x>0)||S.plots.some(p=>p.s>=0)],eq:['Amuletos',()=>Object.keys(S.am).length>0],sk:['Habilidades',()=>S.sp>0||Object.keys(S.sk).length>0],mi:['Misiones',()=>S.frutos>=5||S.mdone>0],
  di:['Diario',()=>S.frutos>=12||herbStats().n>=3],po:['Portal',()=>S.maxL>=12||S.portales>0],sa:['Santuario',()=>S.portales>0]};
function checkUnlocks(silent){let ch=false;for(const k in UNL)if(!S.unl[k]&&UNL[k][1]()){S.unl[k]=1;ch=true;if(!silent){toast('Nueva sección: <b style="color:var(--accent2)">'+UNL[k][0]+'</b>');sfx('ach');if(GUIDES[k])guide(k);}}
  if(ch)renderTabs();}
function checkProgress(silent){checkUnlocks(silent);const na=Object.keys(S.ach).length;
  TIERS.forEach((T,i)=>{if(S.maxL>=T.l||S.L>=T.l)unlockStory('t'+i,silent);});
  for(let i=0;i<Math.min(S.portales,STORY_P.length);i++)unlockStory('p'+i,silent);
  if(!silent){if(seasonOn())guide('es');if(S.sc>=4)guide('cs');}
  setTimeout(()=>{if(Object.keys(S.ach).length!==na)bumpFx();},0);
  for(const a of ACH)if(!S.ach[a.id]&&a.ok()){S.ach[a.id]=1;if(!silent){toast('Logro: <b style="color:var(--legend)">'+a.n+'</b> · +2% fuerza y savia');sfx('ach');}}
}

function drawFruit(c,x,y,r,ti,rar,t,dmg){
  const T=TIERS[ti],h=hueOf(T,t),voidF=T.h===-2;

    c.save();c.strokeStyle=rc;c.lineWidth=1.5;c.globalAlpha=.8;c.setLineDash([3,6]);c.lineDashOffset=-t*20;c.beginPath();c.arc(x,y,r*1.45,0,7);c.stroke();c.restore();
    if(rar===3){c.save();c.strokeStyle=rc;c.globalAlpha=.35;c.lineWidth=1.2;for(let i=0;i<10;i++){const a=i*0.628+t*0.4;
      c.beginPath();c.moveTo(x+Math.cos(a)*r*1.6,y+Math.sin(a)*r*1.6);c.lineTo(x+Math.cos(a)*r*2.3,y+Math.sin(a)*r*2.3);c.stroke();}c.restore();}}
  const body=(px,py,rr)=>{const g=c.createRadialGradient(px-rr*0.35,py-rr*0.4,rr*0.1,px,py,rr*1.05);
    if(voidF){g.addColorStop(0,'#3a2a66');g.addColorStop(0.7,'#120c22');g.addColorStop(1,'#05030b');}
    else{g.addColorStop(0,'hsl('+h+',85%,82%)');g.addColorStop(0.55,'hsl('+h+',70%,55%)');g.addColorStop(1,'hsl('+h+',65%,28%)');}
    return g;};
  c.save();

  if(T.s!=='cluster'){c.fillStyle='hsl(150,55%,45%)';c.beginPath();c.ellipse(x+r*0.28,y-r*1.02,r*0.32,r*0.13,-0.5,0,7);c.fill();}
  if(T.s==='cluster'){const pts=[[0,-0.45],[-0.5,0.05],[0.5,0.05],[-0.22,0.5],[0.25,0.5]];
    for(const p of pts){const px=x+p[0]*r,py=y+p[1]*r;c.fillStyle=body(px,py,r*0.45);c.beginPath();c.arc(px,py,r*0.45,0,7);c.fill();}}
  else{c.fillStyle=body(x,y,r);c.beginPath();
    if(T.s==='oval')c.ellipse(x,y,r*0.82,r*1.08,0,0,7);
    else if(T.s==='pear'){c.arc(x,y+r*0.28,r*0.82,0,7);c.moveTo(x+r*0.5,y-r*0.45);c.arc(x,y-r*0.45,r*0.5,0,7);}
    else if(T.s==='apple'){c.arc(x-r*0.3,y,r*0.78,0,7);c.moveTo(x+r*1.08,y);c.arc(x+r*0.3,y,r*0.78,0,7);}
    else if(T.s==='heart'){c.moveTo(x,y+r);c.bezierCurveTo(x-r*1.5,y-r*0.1,x-r*0.8,y-r*1.25,x,y-r*0.45);c.bezierCurveTo(x+r*0.8,y-r*1.25,x+r*1.5,y-r*0.1,x,y+r);}
    else c.arc(x,y,r,0,7);
    c.fill();
    if(T.s==='crown'){c.fillStyle='hsl('+h+',60%,35%)';c.beginPath();c.moveTo(x-r*0.3,y-r*0.85);c.lineTo(x-r*0.2,y-r*1.2);c.lineTo(x,y-r*0.95);c.lineTo(x+r*0.2,y-r*1.2);c.lineTo(x+r*0.3,y-r*0.85);c.fill();}

    if(voidF){c.strokeStyle='hsl(275,90%,70%)';c.lineWidth=1.5;c.shadowColor='hsl(275,90%,70%)';c.shadowBlur=10;c.beginPath();c.arc(x,y,r,0,7);c.stroke();c.shadowBlur=0;}
  }

  c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.ellipse(x-r*0.33,y-r*0.38,r*0.17,r*0.11,-0.6,0,7);c.fill();
  if(T.s==='apple'||rar===3){const s=r*0.28*(0.8+0.2*Math.sin(t*4));c.fillStyle='#fff';c.beginPath();c.moveTo(x+r*0.35,y-r*0.15-s);

  c.restore();
}

        h+='<div class="chal'+(act?' act':'')+(done?' done':'')+'" style="--c:'+c.col+'"><div class="ch-h"><b>'+c.n+'</b><span class="stars">'+'★'.repeat(n)+'<em>'+'★'.repeat(3-n)+'</em></span></div><p>'+c.r+'.</p><div class="ch-f"><span>Premio: <b>'+c.w(1)+'</b> por estrella'+(n?' · llevas '+c.w(1).replace(/^\+(\d+)/,(m,x)=>'+'+(x*n))+'':'')+'</span>'
          +(done?'<em class="ok">Completado</em>':act?'<em class="ok">En curso</em>':S.chal?'':'<button class="offer" data-act="chs" data-id="'+c.id+'">'+(conf?'Toca otra vez':'Empezar · nv '+CHAL_GOAL[n])+'</button>')+'</div></div>';});
      body.innerHTML=h;}
  }
  else if(tab==='po'&&S.psub==='cs'){
    const conf=performance.now()<confirmUntil;const s='pc'+S.core+S.polvo+JSON.stringify(S.stars)+selStar+S.sc+conf;
    if(s!==sig){sig=s;let h=segH(PSUBS(),S.psub,'psub')+'<div class="essbox"><div><span>Polvo estelar</span><br><b style="color:var(--star)">'+fmt(S.polvo)+'</b></div><span>'+S.asc+' ascensi'+(S.asc===1?'ón':'ones')+'<br>Estaciones este ciclo: '+Math.min(S.sc,4)+' / 4</span></div>';
      let lines='',dots='';STARS.forEach(st=>{if(st.req){const r=STARS.find(x=>x.id===st.req);lines+='<line x1="'+r.x+'" y1="'+r.y+'" x2="'+st.x+'" y2="'+st.y+'" class="'+(starOn(st.id)?'on':'')+'"/>';}});
      STARS.forEach(st=>{const on=starOn(st.id),av=!on&&(!st.req||starOn(st.req));dots+='<g class="st'+(on?' on':av?' av':'')+(selStar===st.id?' sel':'')+'" data-act="star" data-id="'+st.id+'"><circle cx="'+st.x+'" cy="'+st.y+'" r="16" class="hit"/><circle cx="'+st.x+'" cy="'+st.y+'" r="'+(st.p>=5?7:5)+'" class="core"/></g>';});
      h+='<div class="sky"><svg viewBox="0 0 300 220">'+['Luna','Árbol','Zorro'].map((c,i)=>'<text x="'+[50,150,250][i]+'" y="214" text-anchor="middle">'+c+'</text>').join('')+lines+'<line x1="150" y1="38" x2="150" y2="12" class="'+(S.core?'on':'')+'"/><circle cx="150" cy="12" r="'+(allStars()?6+Math.min(4,S.core*0.5):4)+'" fill="'+(allStars()?'#fff3c4':'#3a2f5c')+'" style="'+(allStars()?'filter:drop-shadow(0 0 8px #ffd166)':'')+'"/>'+dots+'</svg></div>';
      {const ok=allStars();h+='<div class="detail" style="border-color:'+(ok?'#fff3c4':'var(--line)')+'"><b>Corazón del cielo'+(S.core?' · nivel '+S.core:'')+'</b><p>'+(ok?'Se puede mejorar sin límite. Cada nivel da +25% de fuerza, savia y experiencia para siempre. Ahora: +'+(25*S.core)+'%.':'Despierta cuando enciendes las 12 estrellas. Después podrás mejorarlo sin límite.')+'</p>'
        +(ok?'<button class="big" data-act="core"'+(S.polvo<coreCost()?' disabled':'')+'>'+(S.polvo<coreCost()?'Necesitas '+coreCost()+' de polvo estelar':'Mejorar por '+coreCost()+' de polvo')+'</button>':'')+'</div>';}
      const st=STARS.find(x=>x.id===selStar),on=starOn(st.id),av=!on&&(!st.req||starOn(st.req));
      h+='<div class="detail"><b>'+st.n+' · '+st.c+'</b><p>'+st.d+'</p><button class="big" data-act="buystar"'+(!av||S.polvo<st.p?' disabled':'')+'>'+(on?'Encendida':!av?'Enciende antes la estrella anterior':S.polvo<st.p?'Necesitas '+st.p+' de polvo estelar':'Encender por '+st.p+' de polvo')+'</button></div>'
        +'<div class="frag"><b>Próximo escenario: '+BIOMES[(biome()+1)%BIOMES.length].n+'</b><p>'+BIOMES[(biome()+1)%BIOMES.length].d+'. '+BIOMES[(biome()+1)%BIOMES.length].b+'.</p></div>'
        +'<p class="note">Ascender reinicia casi todo: esencia, Santuario, criaturas, sellos'+(starOn('cofre')?'':' y amuletos')+'. Conservas las estrellas, el herbario, los logros, la crónica y el huerto. Ganarías <b style="color:var(--star)">+'+ascGain()+' polvo estelar</b>.</p>'
        +'<button class="big'+(conf?' warn':'')+'" data-act="ascend"'+(S.sc>=4?'':' disabled')+'>'+(S.sc>=4?(conf?'Toca otra vez para ascender':'Ascender al cielo'):'Completa el ciclo de las 4 estaciones')+'</button>';
      body.innerHTML=h;}
  }
  else if(tab==='po'&&S.psub==='es'){
    const conf=performance.now()<confirmUntil;const s='ps'+S.season+S.pk+conf+S.seals.join()+seasonOn();
    if(s!==sig){sig=s;let h=segH(PSUBS(),S.psub,'psub');
      if(!seasonOn())h+='<div class="frag lock"><b>Las estaciones duermen</b><p>Despiertan cuando cruzas el portal 3 veces. Llevas '+S.portales+'.</p></div>';
      else{const cur=SEASONS[S.season];
        h+='<div class="h"><h3 style="background:none;color:'+cur.col+'">'+cur.n+'</h3><span>Estación actual</span></div><div class="frag" style="border-color:color-mix(in srgb,'+cur.col+' 45%,var(--line))"><b>Efecto</b><p>'+cur.d+'</p></div>'
          +'<div class="stats">'+SEASONS.map((x,i)=>'<div class="stat" style="'+(i===S.season?'border-color:'+x.col:'')+'"><span style="color:'+x.col+'">Sellos de '+x.n.toLowerCase()+'</span><b>'+S.seals[i]+'</b><span style="text-transform:none;letter-spacing:0">'+x.seal+' cada uno</span></div>').join('')+'</div>'
          +'<div class="preq'+(S.pk>=3?' done':'')+'" style="--c:'+cur.col+'"><div class="pn"><i></i>Portales cruzados en '+cur.n.toLowerCase()+'<small>'+Math.min(S.pk,3)+' / 3</small></div><span class="ok">'+(S.pk>=3?'✓':'')+'</span><div class="bar"><i style="width:'+Math.min(100,S.pk/3*100)+'%"></i></div></div>'
          +'<p class="note">Al cambiar de estación ganas un sello de '+cur.n.toLowerCase()+' para siempre, el árbol vuelve a empezar y los portales vuelven a ser baratos. Conservas esencia, Santuario, criaturas, amuletos y herbario.</p>'
          +'<button class="big'+(conf?' warn':'')+'" data-act="season"'+(S.pk>=3?'':' disabled')+'>'+(S.pk>=3?(conf?'Toca otra vez para cambiar':'Dar paso '+(S.season===3?'a la primavera':'al '+SEASONS[(S.season+1)%4].n.toLowerCase())):'Cruza 3 portales en esta estación')+'</button>';}
      body.innerHTML=h;}
  }
  else if(tab==='po'){
    const P=phases(),ph=S.portal.ph,req=portalReq(),done=phaseDone(),ready=portalReady(),conf=performance.now()<confirmUntil;
    const s='po'+S.psub+ph+S.portal.k+'|'+S.keys+'|'+Math.round(fx().luck)+req.map(r=>Math.floor(r.have/r.need*200)).join()+conf+S.portales+(S.savia>0)+JSON.stringify(S.am).length;
    if(s!==sig){sig=s;const PK=S.portal.k,F=fx();let rings='';const R3=[66,57,48],CX=120;
      P.forEach((p,pi)=>{const r=R3[pi],C2=2*Math.PI*r;
        if(pi<ph){rings+='<circle cx="'+CX+'" cy="'+CX+'" r="'+r+'" fill="none" stroke="'+p.col+'" stroke-width="6" style="filter:drop-shadow(0 0 4px '+p.col+')"/>';return;}
        if(pi>ph){rings+='<circle cx="'+CX+'" cy="'+CX+'" r="'+r+'" fill="none" stroke="var(--surface2)" stroke-width="6" stroke-opacity=".5"/>';return;}
        const n=req.length,seg=C2/n,gap=4;req.forEach((q,i)=>{const f=Math.min(1,q.have/q.need),len=(seg-gap)*f,off=-(i*seg);
          rings+='<circle cx="'+CX+'" cy="'+CX+'" r="'+r+'" fill="none" stroke="var(--surface2)" stroke-width="6" stroke-dasharray="'+(seg-gap)+' '+(C2-seg+gap)+'" stroke-dashoffset="'+off+'"/>';
          if(len>0)rings+='<circle cx="'+CX+'" cy="'+CX+'" r="'+r+'" fill="none" stroke="var('+q.col+')" stroke-width="6" stroke-dasharray="'+len+' '+(C2-len)+'" stroke-dashoffset="'+off+'"/>';});});
      // anillo de piedra con 8 huecos
      const RS=96,SN=!UIN()?{a:'#a39b8e',b:'#857d70',c:'#91897c',d:'#6f685d',e:'#5a5348'}:{a:'#2a2142',b:'#4a3d6e',c:'#3a2f58',d:'#1a1430',e:'#5a4a80'};let stone='<circle cx="'+CX+'" cy="'+CX+'" r="'+RS+'" fill="none" stroke="'+SN.a+'" stroke-width="30"/><circle cx="'+CX+'" cy="'+CX+'" r="'+(RS+14)+'" fill="none" stroke="'+SN.b+'" stroke-width="2"/><circle cx="'+CX+'" cy="'+CX+'" r="'+(RS-14)+'" fill="none" stroke="'+SN.b+'" stroke-width="2"/>';
      for(let i=0;i<24;i++){const a2=i*Math.PI/12+0.13;stone+='<line x1="'+(CX+Math.cos(a2)*(RS-14))+'" y1="'+(CX+Math.sin(a2)*(RS-14))+'" x2="'+(CX+Math.cos(a2)*(RS+14))+'" y2="'+(CX+Math.sin(a2)*(RS+14))+'" stroke="'+SN.c+'" stroke-width="1.5"/>';}
      const ang=i=>-Math.PI/2+i*2*Math.PI/KEYS_N;
      if(PK>1){const a0=ang(0),a1=ang(PK-1),large=(a1-a0)>Math.PI?1:0;stone+='<path d="M'+(CX+Math.cos(a0)*RS)+' '+(CX+Math.sin(a0)*RS)+' A'+RS+' '+RS+' 0 '+large+' 1 '+(CX+Math.cos(a1)*RS)+' '+(CX+Math.sin(a1)*RS)+'" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round" style="filter:drop-shadow(0 0 4px #ffd166)"/>';}
      if(PK>=KEYS_N)stone+='<circle cx="'+CX+'" cy="'+CX+'" r="'+RS+'" fill="none" stroke="#ffd166" stroke-width="4" style="filter:drop-shadow(0 0 4px #ffd166)"/>';
      for(let i=0;i<KEYS_N;i++){const x=CX+Math.cos(ang(i))*RS,y=CX+Math.sin(ang(i))*RS,on=i<PK;
        stone+='<circle cx="'+x+'" cy="'+y+'" r="11" fill="'+(on?'#0f3a48':SN.d)+'" stroke="'+(on?'var(--rune)':SN.e)+'" stroke-width="2"'+(on?' style="filter:drop-shadow(0 0 6px var(--rune))"':'')+'/>';
        if(on)stone+='<path d="M'+x+' '+(y-6)+'V'+(y+6)+'M'+(x-4)+' '+(y-3)+'L'+x+' '+y+'L'+(x+4)+' '+(y-3)+'" stroke="#c9f6ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>';}
      let h=segH(PSUBS(),S.psub,'psub')+'<div class="h"><h3>Portal del bosque</h3><span>Portal '+(S.pk+1)+' · fase '+(ph+1)+' de 3</span></div>'
        +'<div class="portal'+(ready?' ready':'')+'"><svg class="ring" viewBox="0 0 240 240"><defs><radialGradient id="pg"><stop offset="0" stop-color="var(--ess)" stop-opacity="'+(ready?.9:.5)+'"/><stop offset=".7" stop-color="var(--accent)" stop-opacity=".15"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></radialGradient></defs>'
        +'<circle cx="'+CX+'" cy="'+CX+'" r="42" fill="url(#pg)"/><g class="swirl" style="transform-origin:120px 120px"><path d="M120 92a28 28 0 0 1 0 56a18 18 0 0 1 0-36a9 9 0 0 1 0 18" fill="none" stroke="var(--ess)" stroke-opacity=".7" stroke-width="1.6"/></g>'
        +stone+'<g transform="rotate(-90 '+CX+' '+CX+')">'+rings+'</g></svg></div>'
        +'<div class="keybar"><b>'+PK+'<small> / '+KEYS_N+'</small></b><span>Llaves rúnicas colocadas · tienes '+S.keys+'<br>Fruto rúnico: '+(keyChance(0,F)*100).toFixed(1).replace('.',',')+'% de llave (más en raros)</span>'
        +'<button class="place" data-act="place"'+(S.keys>0&&PK<KEYS_N?'':' disabled')+'>Colocar '+Math.min(S.keys,KEYS_N-PK)+'</button></div>'
        +'<div class="phases">'+P.map((p,i)=>'<span class="'+(i<ph?'pd':i===ph?'pc':'')+'" style="--c:'+p.col+'">'+(i<ph?'✓ ':'')+p.n+'</span>').join('')+'</div>';
      req.forEach(r=>{const ok=r.have>=r.need;const val=r.abs==='L'?'Nv '+S.L+' / '+r.need:fmt(r.have)+' / '+fmt(r.need);
        h+='<div class="preq'+(ok?' done':'')+'" style="--c:var('+r.col+')"><div class="pn"><i></i>'+r.n+'<small>'+val+'</small></div>'
          +(ok?'<span class="ok">✓</span>':r.offer?'<button class="offer" data-act="off" data-o="'+r.offer+'">Ofrecer</button>':'<span></span>')
          +'<div class="bar"><i style="width:'+Math.min(100,r.have/r.need*100)+'%"></i></div></div>';});
      if(ph<2)h+='<p class="note">Los contadores de esta fase empiezan cuando la abres. Al completarla se ilumina un anillo del portal.</p>'
        +'<button class="big" data-act="phase"'+(done?'':' disabled')+'>'+(done?'Completar la fase '+P[ph].n:'Completa las ofrendas de '+P[ph].n)+'</button>';
      else h+='<p class="note">Al cruzar vuelves al nivel '+(1+3*sa('brote'))+' y pierdes la savia, las mejoras y las habilidades. Conservas amuletos, herbario, misiones y el Santuario. Recompensa: <b style="color:var(--ess)">+'+essGain()+' esencia</b>, más si cruzas con más nivel.</p>'
        +'<button class="big '+(conf?'warn':'ess')+'" data-act="cross"'+(ready?'':' disabled')+'>'+(ready?(conf?'Toca otra vez para cruzar':'Abrir el portal'):!phaseDone()?'Completa las ofrendas de la Copa':'Coloca las '+KEYS_N+' llaves rúnicas')+'</button>';
      body.innerHTML=h;}
  }
  else if(S.ssub==='cr'){
    const s='cr'+S.esencia+JSON.stringify(S.cr)+popId;
    if(s!==sig){sig=s;let h=segH([['au','Automatización'],['cr','Criaturas']],S.ssub,'ssub')+'<div class="h"><h3>Criaturas</h3><span>'+fmt(S.esencia)+' ✦ esencia</span></div><div class="note">Cada criatura vive en tu jardín y te ayuda a su manera.</div>';
      CR.forEach(c=>{const l=cr(c.id),mx=l>=c.max,co=mx?0:crCost(c,l),ok=!mx&&S.esencia>=co;
        h+='<button class="row ess'+(mx?' max':ok?' can':' no')+(popId==='cr_'+c.id?' pop':'')+'" style="--c:'+c.col+'" data-act="crb" data-id="'+c.id+'"><span class="ico">'+I.herb+'</span><div class="n">'+c.n+'<small>nv '+l+'</small></div><div class="d">'+c.d(mx?l:l+1)+'</div><div class="c">'+(mx?'Máx':fmt(co)+' ✦')+'</div></button>';});
      body.innerHTML=h;popId=null;}
  }
  else{
    const s='sa'+S.esencia+JSON.stringify(S.sa)+popId;
    if(s!==sig){sig=s;let h=segH([['au','Automatización'],['cr','Criaturas']],S.ssub,'ssub')+'<div class="essbox"><div><span>Esencia</span><br><b>'+fmt(S.esencia)+'</b></div><span>'+S.portales+' portal'+(S.portales===1?'':'es')+' cruzado'+(S.portales===1?'':'s')+'<br>'+fmt(S.essTotal)+' esencia en total</span></div>'
      +'<div class="note">La esencia no se pierde nunca. Úsala para que el bosque trabaje por ti.</div>';
      SA.forEach(it=>{const l=sa(it.id),mx=l>=it.max,c=mx?0:it.cost(l),ok=!mx&&S.esencia>=c;
        h+='<button class="row ess'+(mx?' max':ok?' can':' no')+(popId==='sa_'+it.id?' pop':'')+'" style="--c:'+it.col+'" data-act="sab" data-id="'+it.id+'"><span class="ico">'+it.ic+'</span><div class="n">'+it.n+(it.max>1?'<small>nv '+l+'</small>':'')+'</div><div class="d">'+(mx?it.d(l):it.d(it.max>1?l+1:l))+'</div><div class="c">'+(mx?(it.max>1?'Máx':'Activo'):fmt(c)+' ✦')+'</div></button>';});
      body.innerHTML=h;popId=null;}
  }
}
let hiddenAt=0;dailyCheck();
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();save();musicStop();}else if(hiddenAt){const h=hiddenAt;hiddenAt=0;t0=performance.now();offline(h);returnSummary((Date.now()-h)/1000);dailyCheck();updateUI();}});
window.addEventListener('pagehide',save);
updateUI();requestAnimationFrame(frame);
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
